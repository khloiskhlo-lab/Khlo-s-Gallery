<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Music · Khlo's Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Sedgwick+Ave+Display&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --teal: #1a6670; --coral: #e0836f; --cream: #fdf8ec; --ink: #3b2a1a;
      --red: #e3262b; --blue: #1f4fd8; --yellow: #ffd400; --green: #1fa34a; --black: #111;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
      background: linear-gradient(180deg, #b7c9ec 0%, #d6e2f6 50%, #eaf0fa 100%) fixed; color: var(--ink);
      font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px;
    }

    /* Navigation bar */
    header { position: sticky; top: 0; z-index: 10; }
    .top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--blue); overflow-x: auto; }
    .tab {
      flex: none; padding: 9px 20px; border-radius: 18px; border: 3px solid var(--black);
      background: #fff; color: var(--black); text-decoration: none;
      font: 400 1.05rem 'Anton', Impact, sans-serif; text-transform: uppercase; letter-spacing: 1.5px;
      box-shadow: 3px 3px 0 var(--black); transition: transform .15s;
    }
    .tab:hover { transform: translateY(-2px) rotate(-1deg); }
    .tab.on { background: var(--yellow); }
    .stripe { display: flex; height: 8px; }
    .stripe i { flex: 1; } .stripe i:nth-child(1){background:var(--red)} .stripe i:nth-child(2){background:var(--yellow)}
    .stripe i:nth-child(3){background:var(--blue)} .stripe i:nth-child(4){background:var(--green);flex:.2}

    main { max-width: 760px; margin: 0 auto; padding: 22px 14px 70px; }

    /* Section banner */
    .banner {
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      min-height: 200px; padding: 20px; border-radius: 8px; margin-bottom: 22px;
      box-shadow: 0 10px 24px rgba(60,40,20,.3);
      background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)), url('basquiat.jpg') center / cover,
                  linear-gradient(135deg, #111, #f2c500 60%, #d62828);
    }
    .banner h2 { margin: 0; font: 400 clamp(2rem, 9vw, 3.2rem)/1.05 'Anton', Impact, sans-serif; text-transform: uppercase; letter-spacing: 1px; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
    .banner p { margin: 10px 0 0; font: 400 1rem 'Anton', Impact, sans-serif; text-transform: uppercase; letter-spacing: 1.5px; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.8); }

    /* 3 x 3 album grid */
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px; }
    .tile { all: unset; cursor: pointer; display: block; text-align: center; }
    .cv {
      position: relative; display: grid; place-items: center; aspect-ratio: 1; padding: 6px; overflow: hidden;
      background: var(--c); color: #fff; font: 15px/1.1 'Sedgwick Ave Display', cursive;
      border: 3px solid var(--black); box-shadow: 5px 5px 0 var(--c); transition: transform .2s;
    }
    .tile:hover .cv, .tile:focus-visible .cv { transform: translateY(-4px) rotate(-1.5deg); }
    .cv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .tt { display: block; margin-top: 10px; font-weight: 700; font-size: 15px; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ta { display: block; font-size: 13px; opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ts { display: block; font-size: 14px; letter-spacing: 1px; color: #c9a000; min-height: 18px; }
    .hint { text-align: center; font-style: italic; opacity: .7; margin-top: 18px; font-size: 1rem; }

    /* Pop-up player */
    .modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(17,17,17,.75); overflow-y: auto; }
    .modal[hidden] { display: none; }
    .sheet { position: relative; width: min(100%, 420px); background: var(--cream); border: 4px solid var(--black); border-radius: 14px; padding: 18px; box-shadow: 8px 8px 0 var(--c, var(--red)); }
    .x { position: absolute; top: 8px; right: 10px; width: 36px; height: 36px; border-radius: 12px; border: 0; background: var(--coral); color: #fff; font-size: 18px; cursor: pointer; z-index: 3; }
    .vw { position: relative; width: 100%; aspect-ratio: 1.3; margin: 8px 0 12px; }
    .vw .big { position: absolute; left: 0; top: 0; width: 72%; aspect-ratio: 1; z-index: 2; background: var(--c); border: 3px solid var(--black); box-shadow: 0 10px 24px rgba(0,0,0,.45); object-fit: cover; }
    .disc { position: absolute; right: 0; top: 3%; width: 68%; aspect-ratio: 1; border-radius: 50%; z-index: 1; display: grid; place-items: center;
      background: repeating-radial-gradient(circle, #0b0b0b 0 2px, #1f1f1f 3px 4px); box-shadow: 0 8px 20px rgba(0,0,0,.5); transform: translateX(-41%); }
    .disc i { width: 34%; aspect-ratio: 1; border-radius: 50%; background: var(--c, var(--red)); display: block; }
    .vw.go .disc { animation: out .8s ease forwards, spin 3.2s linear .8s infinite; }
    @keyframes out { to { transform: translateX(0); } }
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    .sheet h3 { margin: 4px 0 0; font: 400 2.1rem/1 'Sedgwick Ave Display', cursive; }
    .sheet .by { margin: 2px 0 12px; font-weight: 700; opacity: .75; }
    .sheet iframe { width: 100%; height: 80px; border: 0; border-radius: 12px; display: block; }
    .rate { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .star { font-size: 34px; line-height: 1; padding: 2px 3px; cursor: pointer; background: none; border: 0; color: #d9d9d9; -webkit-text-stroke: 1.5px var(--black); transition: transform .15s; }
    .star:hover { transform: scale(1.2) rotate(-6deg); }
    .star.on { color: var(--yellow); }
    .label { font-weight: 700; font-size: 1rem; } .label.done { color: var(--green); }
    footer { text-align: center; padding: 0 16px 36px; font-size: 14px; opacity: .6; }
  </style>
</head>
<body>

<header>
  <nav class="top">
    <a class="tab" href="index.html">Home</a>
    <a class="tab" href="exhibitions.html">Exhibitions</a>
    <a class="tab on" href="music.html">Music</a>
  </nav>
  <div class="stripe"><i></i><i></i><i></i><i></i></div>
</header>

<main>
  <!-- ===== SECTION 1: PERSONAL FAVORITES ===== -->
  <div class="banner"><h2>Personal favorites</h2><p>All my favorite, rateable songs</p></div>
  <div class="grid" id="grid"></div>
  <p class="hint">Tap an album to open it, play the song and rate it.</p>

  <!-- SECTION 2 goes here later -->
</main>
<footer>Ratings are saved on your own device.</footer>

<div class="modal" id="modal" hidden>
  <div class="sheet" id="sheet">
    <button class="x" id="x" aria-label="Close">✕</button>
    <div class="vw" id="vw"><div class="disc"><i></i></div><img class="big" id="big" alt=""></div>
    <h3 id="mt"></h3><p class="by" id="ma"></p>
    <iframe id="mf" allow="autoplay; clipboard-write; encrypted-media" title="Spotify player"></iframe>
    <div class="rate"><span id="stars"></span><span class="label" id="lab"></span></div>
  </div>
</div>

<script>
  // ---- Your songs. id = the part of the Spotify link between /track/ and the ? ----
  // Covers load from Spotify automatically. To use your own picture instead, add img: "yourfile.jpg"
  var songs = [
    { title: "Confessions",        artist: "BADBADNOTGOOD",         id: "1Sc2RHxyKHMeyCChQTWTnp" },
    { title: "Someday, Somewhere", artist: "Jungle",                id: "20FqWsyuUaQTU5tk4nP6eN" },
    { title: "Better Off Dead",    artist: "Sleeping with Sirens",  id: "4MjJlPgUYMQjvHOQq0uvOv" },
    { title: "free.99",            artist: "Malcolm Todd",          id: "7t3foREw43cV1hHZZPhwnY" },
    { title: "Be Careful",         artist: "Gabriel Jacoby",        id: "7bVitlfQ30KsBAOpLePugd" },
    { title: "Falling (in place)", artist: "Noah Guy",              id: "0tCd1wfXWkZsWB8mRop3B2" },
    { title: "Bulls in the Bronx", artist: "Pierce the Veil",       id: "23UoI3jlFiWdo5jadUYo69" },
    { title: "Scar Tissue",        artist: "Red Hot Chili Peppers", id: "1G391cbiT3v3Cywg8T7DM1" },
    { title: "Besame Mucho",       artist: "João Gilberto",         id: "2yEpIibskkd64N9l5NsuJC" }
  ];
  var cols = ['#e3262b', '#1f4fd8', '#ffd400'], covers = {}, cur = 0;
  var $ = function (id) { return document.getElementById(id); };

  function getR(id) { try { return parseInt(localStorage.getItem('rate-' + id), 10) || 0; } catch (e) { return 0; } }
  function setR(id, n) { try { n ? localStorage.setItem('rate-' + id, n) : localStorage.removeItem('rate-' + id); } catch (e) {} }
  function starText(n) { return n ? '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n) : ''; }

  // Build the 3x3 grid
  $('grid').innerHTML = songs.map(function (s, i) {
    return '<button class="tile" data-i="' + i + '" style="--c:' + cols[i % 3] + '">' +
      '<span class="cv">' + s.title + '</span>' +
      '<span class="tt">' + s.title + '</span><span class="ta">' + s.artist + '</span>' +
      '<span class="ts" id="ts' + i + '">' + starText(getR(s.id)) + '</span></button>';
  }).join('');

  // Load album covers
  function putCover(i, url) {
    covers[i] = url;
    var cv = document.querySelector('.tile[data-i="' + i + '"] .cv'), img = new Image();
    img.alt = songs[i].title;
    img.onload = function () { cv.appendChild(img); };
    img.src = url;
  }
  songs.forEach(function (s, i) {
    if (s.img) { putCover(i, s.img); return; }
    fetch('https://open.spotify.com/oembed?url=https://open.spotify.com/track/' + s.id)
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d.thumbnail_url) putCover(i, d.thumbnail_url); })
      .catch(function () {});
  });

  // Pop-up
  function paint() {
    var n = getR(songs[cur].id);
    document.querySelectorAll('#stars .star').forEach(function (b, k) { b.classList.toggle('on', k < n); });
    $('lab').textContent = n ? 'You rated it ' + n + '/5' : 'Tap a star to rate';
    $('lab').classList.toggle('done', !!n);
    $('ts' + cur).textContent = starText(n);
  }
  $('stars').innerHTML = [1,2,3,4,5].map(function (n) { return '<button class="star" data-n="' + n + '" aria-label="' + n + ' stars">★</button>'; }).join('');
  document.querySelectorAll('#stars .star').forEach(function (b) {
    b.onclick = function () {
      var n = parseInt(b.dataset.n, 10), id = songs[cur].id;
      if (n === getR(id)) n = 0;
      setR(id, n); paint();
    };
  });
  function openSong(i) {
    cur = i; var s = songs[i];
    $('sheet').style.setProperty('--c', cols[i % 3]);
    $('mt').textContent = s.title; $('ma').textContent = s.artist;
    $('big').src = covers[i] || ''; $('big').style.visibility = covers[i] ? 'visible' : 'hidden';
    $('mf').src = 'https://open.spotify.com/embed/track/' + s.id;
    $('modal').hidden = false; document.body.style.overflow = 'hidden';
    var vw = $('vw'); vw.classList.remove('go'); void vw.offsetWidth; vw.classList.add('go');
    paint();
  }
  function closeSong() { $('modal').hidden = true; $('mf').src = ''; document.body.style.overflow = ''; }
  document.querySelectorAll('.tile').forEach(function (t) { t.onclick = function () { openSong(+t.dataset.i); }; });
  $('x').onclick = closeSong;
  $('modal').onclick = function (e) { if (e.target === $('modal')) closeSong(); };
  addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSong(); });
</script>
</body>
</html>
