<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gallery Music · Khlo's Gallery</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body.music-page {
      background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)), url('basquiat.jpg') center / cover fixed, #111;
      color: #fff;
      text-align: center;
    }
    .music-page h1 { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: clamp(3.5rem, 15vw, 6rem); margin: 30px 0 10px; text-shadow: 0 2px 12px #000; }
    .music-page .top { background: transparent; }
    .player { max-width: 520px; margin: 20px auto; padding: 0 16px; }
    .player iframe { width: 100%; border: 0; border-radius: 12px; }
    #play { margin: 20px auto; cursor: pointer; border: 0; }
  </style>
</head>
<body class="music-page">
  <header class="top">
    <a class="round-btn small" href="exhibitions.html">Back</a>
  </header>

  <h1>Gallery Music</h1>
  <p>Press play and wander.</p>

  <!-- OPTION A: your own song file -->
  <audio id="song" src="song.mp3" loop></audio>
  <button id="play" class="round-btn" onclick="toggle()">Play</button>

  <script>
    var song = document.getElementById('song'), btn = document.getElementById('play');
    function toggle() {
      if (song.paused) { song.play(); btn.textContent = 'Pause'; }
      else { song.pause(); btn.textContent = 'Play'; }
    }
  </script>
</body>
</html>
